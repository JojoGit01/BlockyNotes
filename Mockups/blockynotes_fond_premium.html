<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BlockyNotes — Fond Premium</title>
  <style>
    :root {
      --bg: #f7f6f3;
      --navy: #0d1b3d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, #ffffff 0, #f4f1ff 28%, #f7f6f3 60%, #eef4ff 100%);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .phone {
      width: 390px;
      height: 844px;
      border-radius: 42px;
      border: 10px solid #101828;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, #fbfaf8 0%, #f7f6f3 100%);
      box-shadow: 0 28px 90px rgba(10, 17, 35, .22);
    }

    .bg-blur::before,
    .bg-blur::after {
      content: "";
      position: absolute;
      border-radius: 999px;
      filter: blur(44px);
      opacity: .78;
      pointer-events: none;
    }

    .bg-blur::before {
      width: 220px;
      height: 220px;
      right: -90px;
      top: 40px;
      background: #efe8ff;
    }

    .bg-blur::after {
      width: 240px;
      height: 240px;
      left: -100px;
      bottom: 80px;
      background: #e6f7ff;
    }

    .home-indicator {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: 6px;
      width: 120px;
      height: 4px;
      border-radius: 999px;
      background: #101828;
      opacity: .8;
      z-index: 2;
    }

    @media (max-width: 430px) {
      body {
        place-items: stretch;
        background: #101828;
      }

      .phone {
        width: 100vw;
        height: 100vh;
        border-radius: 0;
        border: none;
      }
    }
  </style>
</head>
<body>
  <main class="phone">
    <div class="bg-blur"></div>
    <div class="home-indicator"></div>
  </main>
</body>
</html>
